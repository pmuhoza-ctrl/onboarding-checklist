<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilote's notes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--surface:#181c27;--surface2:#1e2335;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
    --text:#e8eaf0;--muted:#7a8099;--dim:#4a5068;
    --accent:#4f8ef7;--accent-bg:rgba(79,142,247,0.12);--accent-border:rgba(79,142,247,0.3);
    --green:#3ecf8e;--green-bg:rgba(62,207,142,0.1);--green-border:rgba(62,207,142,0.25);
    --amber:#f59e0b;--amber-bg:rgba(245,158,11,0.1);--amber-border:rgba(245,158,11,0.3);
    --radius:10px;--radius-sm:6px;
    --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  }
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem 4rem;line-height:1.6}
  .container{max-width:720px;margin:0 auto}
  header{margin-bottom:2rem}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:.5rem}
  h1{font-size:1.6rem;font-weight:600;color:var(--text);letter-spacing:-.02em;margin-bottom:.25rem}
  .subtitle{font-size:13px;color:var(--muted)}
  .tabs{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
  .tab{font-family:var(--font);font-size:13px;font-weight:500;padding:7px 16px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s ease}
  .tab:hover{color:var(--text);background:var(--surface2)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .progress-row{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
  .progress-track{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
  .progress-label{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:right}
  .reset-btn{font-family:var(--font);font-size:12px;color:var(--dim);background:transparent;border:1px solid var(--border);padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
  .reset-btn:hover{color:var(--muted);border-color:var(--border2)}
  .steps{display:flex;flex-direction:column;gap:4px}
  .step{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;transition:background .12s,border-color .12s;position:relative}
  .step:hover{background:var(--surface2);border-color:var(--border)}
  .step.done{background:var(--green-bg);border-color:var(--green-border)}
  .step.has-note{cursor:default}
  .step.has-note:hover{background:var(--surface2);border-color:var(--border)}
  .step-num{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:20px;padding-top:2px;flex-shrink:0}
  .step.done .step-num{color:var(--green)}
  .check-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px;cursor:pointer}
  .step.done .check-box{background:var(--green);border-color:var(--green)}
  .check-icon{display:none;width:11px;height:11px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .step.done .check-icon{display:block}
  .step-body{flex:1;min-width:0}
  .step-text{font-size:14px;font-weight:500;color:var(--text);transition:color .12s}
  .step.done .step-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--green)}
  .step-note-short{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .step.done .step-note-short{color:var(--dim)}
  .note-trigger{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-border);padding:2px 8px;border-radius:999px;margin-top:6px;cursor:pointer;transition:all .15s;user-select:none}
  .note-trigger:hover{background:rgba(79,142,247,0.22)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .badge{font-family:var(--mono);font-size:10px;font-weight:500;padding:2px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
  .badge-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
  .badge-info{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}
  .badge-sensor{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
  .section-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:1rem 0 .4rem;border-bottom:1px solid var(--border);margin-bottom:.5rem;margin-top:.5rem}
  .complete-banner{display:none;align-items:center;gap:10px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius);padding:12px 16px;margin-bottom:1rem;font-size:14px;font-weight:500;color:var(--green)}
  .complete-banner.visible{display:flex}
  .popover-backdrop{display:none;position:fixed;inset:0;z-index:100}
  .popover-backdrop.open{display:block}
  .popover{display:none;position:fixed;z-index:101;width:min(560px,calc(100vw - 2rem));background:#1a1f30;border:1px solid var(--border2);border-radius:14px;box-shadow:0 24px 48px rgba(0,0,0,0.5);overflow:hidden}
  .popover.open{display:block}
  .popover-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--border)}
  .popover-title{font-size:13px;font-weight:600;color:var(--text)}
  .popover-close{width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .12s,color .12s;line-height:1}
  .popover-close:hover{background:var(--surface2);color:var(--text)}
  .popover-body{padding:16px;overflow-y:auto;max-height:60vh}
  .note-section{margin-bottom:20px}
  .note-section:last-child{margin-bottom:0}
  .note-section-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
  .note-description{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.6}
  .note-image{width:100%;border-radius:6px;margin-top:8px;display:block}
  .cmd-block{background:#0c0f1a;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;position:relative}
  .cmd-label{font-family:var(--mono);font-size:10px;color:var(--accent);margin-bottom:6px;letter-spacing:.04em}
  .cmd-text{font-family:var(--mono);font-size:11.5px;color:#c9d1e8;white-space:pre-wrap;word-break:break-all;line-height:1.7}
  .cmd-text .flag{color:var(--amber)}
  .cmd-text .value{color:var(--green)}
  .cmd-text .param{color:#a78bfa}
  .copy-btn{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;color:var(--dim);background:var(--surface2);border:1px solid var(--border);padding:3px 8px;border-radius:4px;cursor:pointer;transition:all .12s}
  .copy-btn:hover{color:var(--text);border-color:var(--border2)}
  .copy-btn.copied{color:var(--green);border-color:var(--green-border)}
  .device-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  .device-table th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border)}
  .device-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  .device-table tr:last-child td{border-bottom:none}
  .device-table .mono{font-family:var(--mono);color:var(--accent);font-size:11px}
  .device-table .model{color:var(--muted)}
  .order-bar{display:flex;gap:8px;margin-bottom:1.5rem;align-items:center}
  .order-input-wrap{position:relative;flex:1}
  .order-input{width:100%;font-family:var(--font);font-size:13px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 12px;outline:none;transition:border-color .15s}
  .order-input::placeholder{color:var(--dim)}
  .order-input:focus{border-color:var(--accent)}
  .order-btn{font-family:var(--font);font-size:13px;font-weight:500;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--accent-border);background:var(--accent-bg);color:var(--accent);cursor:pointer;white-space:nowrap;transition:all .15s}
  .order-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .order-pills-wrap{display:none;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
  .order-pills-wrap.visible{display:flex}
  .order-pill{font-family:var(--font);font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s ease;display:flex;align-items:center;gap:6px}
  .order-pill:hover{color:var(--text);background:var(--surface2)}
  .order-pill.active{background:var(--surface2);border-color:var(--accent);color:var(--text)}
  .order-pill-delete{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:11px;line-height:1;color:var(--dim);transition:all .12s;margin-left:2px}
  .order-pill:hover .order-pill-delete,.order-pill.active .order-pill-delete{color:var(--muted)}
  .order-pill-delete:hover{background:rgba(239,68,68,0.2);color:#ef4444 !important}
  .checklist-locked{display:none}
  .checklist-locked.visible{display:block}
  .no-order-msg{text-align:center;padding:3rem 1rem;color:var(--dim);font-size:14px;border:1px dashed var(--border2);border-radius:var(--radius)}
  .no-order-msg strong{color:var(--muted);display:block;margin-bottom:.4rem;font-size:15px}
  .order-note-wrap{display:none;margin-bottom:1.25rem}
  .order-note-wrap.visible{display:block}
  .order-note-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .order-note-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;flex:1}
  .priority-btns{display:flex;gap:5px}
  .priority-btn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s;flex-shrink:0}
  .priority-btn.p-red{background:rgba(239,68,68,0.25);border-color:rgba(239,68,68,0.4)}
  .priority-btn.p-amber{background:rgba(245,158,11,0.25);border-color:rgba(245,158,11,0.4)}
  .priority-btn.p-green{background:rgba(62,207,142,0.25);border-color:rgba(62,207,142,0.4)}
  .priority-btn.p-red.selected{background:#ef4444;border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,0.25)}
  .priority-btn.p-amber.selected{background:#f59e0b;border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,0.25)}
  .priority-btn.p-green.selected{background:#3ecf8e;border-color:#3ecf8e;box-shadow:0 0 0 3px rgba(62,207,142,0.25)}
  .priority-btn:hover{transform:scale(1.15)}
  .order-note-textarea{width:100%;font-family:var(--font);font-size:13px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:10px 12px;resize:vertical;min-height:72px;outline:none;line-height:1.6;transition:border-color .15s}
  .order-note-textarea::placeholder{color:var(--dim)}
  .order-note-textarea:focus{border-color:var(--accent)}
  .order-note-textarea.pri-red{border-left:3px solid #ef4444}
  .order-note-textarea.pri-amber{border-left:3px solid #f59e0b}
  .order-note-textarea.pri-green{border-left:3px solid #3ecf8e}
  .order-note-saved{font-size:11px;color:var(--dim);margin-top:5px;height:14px;transition:opacity .3s}
  .static-section{margin-bottom:2rem}
  .static-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .static-img{width:100%;border-radius:var(--radius);display:block}
  .static-placeholder{border:2px dashed var(--border2);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--dim)}
  .ph-icon{font-size:36px;margin-bottom:8px}
  .ph-text{font-size:13px}
  @media(max-width:480px){h1{font-size:1.3rem}.step{padding:10px 12px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none !important}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="eyebrow">Pilote's notes &middot; Onboarding</div>
    <h1>Onboarding checklist</h1>
    <p class="subtitle">Enter an order name to begin &middot; progress saves per order</p>
  </header>

  <div class="order-bar">
    <div class="order-input-wrap">
      <input class="order-input" id="order-input" type="text" placeholder="Enter order name&hellip;" autocomplete="off" />
    </div>
    <button class="order-btn" id="open-btn">Open</button>
  </div>

  <div class="order-pills-wrap" id="order-pills-wrap"></div>

  <div id="no-order-msg" class="no-order-msg">
    <strong>No order open</strong>Type an order name above and click <em>Open</em> to start &mdash; or pick a saved order.
  </div>

  <div class="order-note-wrap" id="order-note-wrap">
    <div class="order-note-header">
      <span class="order-note-label">Order note</span>
      <div class="priority-btns">
        <button class="priority-btn p-green" title="Low priority" id="pri-green"></button>
        <button class="priority-btn p-amber" title="Medium priority" id="pri-amber"></button>
        <button class="priority-btn p-red" title="High priority" id="pri-red"></button>
      </div>
    </div>
    <textarea class="order-note-textarea" id="order-note-textarea" placeholder="Add a note for this order&hellip;" rows="3"></textarea>
    <div class="order-note-saved" id="order-note-saved"></div>
  </div>

  <div class="checklist-locked" id="checklist-wrap">
    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="0">KK only</button>
      <button class="tab" data-mode="1">Cumulosity only</button>
      <button class="tab" data-mode="2">Dual endpoint</button>
      <button class="tab" data-mode="3">WNSW S1 devices</button>
      <button class="tab" data-mode="4">Radar Jig Config</button>
      <button class="tab" data-mode="5">Cumu to KK</button>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <span class="progress-label" id="prog-label">0 / 0</span>
      <button class="reset-btn" id="reset-btn">Reset mode</button>
    </div>
    <div class="complete-banner" id="complete-banner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      All steps complete &mdash; device commissioned.
    </div>
    <div class="steps" id="steps"></div>
  </div>
</div>

<div class="popover-backdrop" id="backdrop"></div>
<div class="popover" id="popover">
  <div class="popover-header">
    <span class="popover-title" id="popover-title">Notes</span>
    <button class="popover-close" id="popover-close">&#x2715;</button>
  </div>
  <div class="popover-body" id="popover-body"></div>
</div>

var currentMode = 0;
var currentOrder = null;

function omk(order, mk) { return "o:" + order + ":" + mk; }

function loadChecks(mk) {
  if (!currentOrder) return {};
  try { return JSON.parse(localStorage.getItem(omk(currentOrder, mk)) || "{}"); } catch(e) { return {}; }
}

function saveChecks(mk, checks) {
  if (!currentOrder) return;
  try { localStorage.setItem(omk(currentOrder, mk), JSON.stringify(checks)); } catch(e) {}
}

function getOrders() {
  try { return JSON.parse(localStorage.getItem("orders") || "[]"); } catch(e) { return []; }
}

function saveOrders(list) {
  try { localStorage.setItem("orders", JSON.stringify(list)); } catch(e) {}
}

function addOrder(name) {
  var list = getOrders();
  if (list.indexOf(name) === -1) { list.unshift(name); saveOrders(list); }
}

function removeOrder(name) {
  saveOrders(getOrders().filter(function(o) { return o !== name; }));
}

function loadOrCreateOrder() {
  var input = document.getElementById("order-input");
  var name = input.value.trim();
  if (!name) { input.focus(); return; }
  currentOrder = name;
  addOrder(name);
  try {
    var sm = parseInt(localStorage.getItem("o:" + name + ":mode") || "0");
    currentMode = (sm >= 0 && sm < MODES.length) ? sm : 0;
  } catch(e) { currentMode = 0; }
  input.value = "";
  updateOrderUI();
  render();
}

function switchOrder(name) {
  if (!name) return;
  currentOrder = name;
  try {
    var sm = parseInt(localStorage.getItem("o:" + name + ":mode") || "0");
    currentMode = (sm >= 0 && sm < MODES.length) ? sm : 0;
  } catch(e) { currentMode = 0; }
  updateOrderUI();
  render();
}

function deletePill(name) {
  if (!confirm("Delete order \"" + name + "\"? This cannot be undone.")) return;
  MODES.forEach(function(m) {
    try { localStorage.removeItem(omk(name, m.key)); } catch(e) {}
  });
  ["mode","note","priority"].forEach(function(k) {
    try { localStorage.removeItem("o:" + name + ":" + k); } catch(e) {}
  });
  removeOrder(name);
  if (currentOrder === name) { currentOrder = null; currentMode = 0; renderEmpty(); }
  updateOrderUI();
}

function loadNote() {
  if (!currentOrder) return;
  document.getElementById("order-note-textarea").value = localStorage.getItem("o:" + currentOrder + ":note") || "";
  applyPriorityUI(localStorage.getItem("o:" + currentOrder + ":priority") || "");
}

function saveNote() {
  if (!currentOrder) return;
  localStorage.setItem("o:" + currentOrder + ":note", document.getElementById("order-note-textarea").value);
  var el = document.getElementById("order-note-saved");
  el.textContent = "Saved";
  clearTimeout(window._nst);
  window._nst = setTimeout(function() { el.textContent = ""; }, 1500);
}

function setPriority(color) {
  if (!currentOrder) return;
  var cur = localStorage.getItem("o:" + currentOrder + ":priority") || "";
  var next = cur === color ? "" : color;
  localStorage.setItem("o:" + currentOrder + ":priority", next);
  applyPriorityUI(next);
}

function applyPriorityUI(color) {
  var ta = document.getElementById("order-note-textarea");
  ta.className = "order-note-textarea" + (color ? " pri-" + color : "");
  ["green","amber","red"].forEach(function(c) {
    var btn = document.getElementById("pri-" + c);
    if (btn) btn.classList.toggle("selected", c === color);
  });
  updatePillColors();
}

function updatePillColors() {
  var wrap = document.getElementById("order-pills-wrap");
  if (!wrap) return;
  wrap.querySelectorAll(".order-pill").forEach(function(p) {
    var o = p.getAttribute("data-order");
    if (!o) return;
    var pri = localStorage.getItem("o:" + o + ":priority") || "";
    p.style.borderColor = pri === "red" ? "#ef4444" : pri === "amber" ? "#f59e0b" : pri === "green" ? "#3ecf8e" : "";
  });
}

function updateOrderUI() {
  var orders = getOrders();
  var wrap = document.getElementById("order-pills-wrap");
  var noMsg = document.getElementById("no-order-msg");
  var checkWrap = document.getElementById("checklist-wrap");
  var noteWrap = document.getElementById("order-note-wrap");

  if (orders.length > 0) {
    wrap.classList.add("visible");
    wrap.innerHTML = orders.map(function(o) {
      var isActive = o === currentOrder;
      var pri = localStorage.getItem("o:" + o + ":priority") || "";
      var bc = pri === "red" ? "#ef4444" : pri === "amber" ? "#f59e0b" : pri === "green" ? "#3ecf8e" : "";
      var btn = document.createElement("button");
      btn.className = "order-pill" + (isActive ? " active" : "");
      btn.setAttribute("data-order", o);
      if (bc) btn.style.borderColor = bc;
      btn.textContent = o;
      var del = document.createElement("span");
      del.className = "order-pill-delete";
      del.textContent = "x";
      del.setAttribute("data-del", o);
      btn.appendChild(del);
      return btn.outerHTML;
    }).join("");
  } else {
    wrap.classList.remove("visible");
    wrap.innerHTML = "";
  }

  if (currentOrder) {
    noMsg.style.display = "none";
    checkWrap.classList.add("visible");
    noteWrap.classList.add("visible");
    loadNote();
    document.querySelectorAll(".tab").forEach(function(t, i) {
      t.classList.toggle("active", i === currentMode);
    });
  } else {
    noMsg.style.display = "";
    checkWrap.classList.remove("visible");
    noteWrap.classList.remove("visible");
  }
}

function renderEmpty() {
  document.getElementById("steps").innerHTML = "";
  document.getElementById("prog-fill").style.width = "0%";
  document.getElementById("prog-label").textContent = "0 / 0";
  document.getElementById("complete-banner").classList.remove("visible");
  document.getElementById("order-note-wrap").classList.remove("visible");
}

function toggleStep(idx) {
  var mode = MODES[currentMode];
  var checks = loadChecks(mode.key);
  checks[idx] = !checks[idx];
  saveChecks(mode.key, checks);
  render();
}

function switchMode(idx) {
  currentMode = idx;
  if (currentOrder) {
    try { localStorage.setItem("o:" + currentOrder + ":mode", idx); } catch(e) {}
  }
  document.querySelectorAll(".tab").forEach(function(t, i) {
    t.classList.toggle("active", i === idx);
  });
  render();
}

function openNote(key) {
  var note = AA_NOTES[key];
  if (!note) return;
  document.getElementById("popover-title").textContent = note.title;
  var html = "";
  note.sections.forEach(function(sec) {
    html += "<div class=\"note-section\">";
    html += "<div class=\"note-section-label\">" + sec.label + "</div>";
    if (sec.description) html += "<div class=\"note-description\">" + sec.description + "</div>";
    if (sec.imagePlaceholder) {
      html += "<div style=\"border:2px dashed var(--border2);border-radius:8px;padding:32px;text-align:center;color:var(--dim);margin-top:8px;\">";
      html += "<div style=\"font-size:32px;margin-bottom:8px;\">&#x1F4F7;</div>";
      html += "<div style=\"font-size:13px;\">Photo placeholder &mdash; add your sensor test set-up image here</div>";
      html += "</div>";
    }
    if (sec.image) {
      html += "<img class=\"note-image\" src=\"" + sec.image + "\" alt=\"Test reference\">";
    }
    if (sec.variantList) {
      html += "<div style=\"margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;\">";
      sec.variantList.forEach(function(v) {
        html += "<span style=\"font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--border2);padding:3px 10px;border-radius:999px;color:var(--muted);\">" + v + "</span>";
      });
      html += "</div>";
    }
    if (sec.table) {
      html += "<table class=\"device-table\"><thead><tr><th>device_type</th><th>Hardware model</th></tr></thead><tbody>";
      sec.table.forEach(function(row) {
        html += "<tr><td class=\"mono\">" + row.type + "</td><td class=\"model\">" + row.model + "</td></tr>";
      });
      html += "</tbody></table>";
    }
    if (sec.commands) {
      sec.commands.forEach(function(c, ci) {
        var id = key + "_" + ci;
        html += "<div class=\"cmd-block\">";
        html += "<div class=\"cmd-label\">" + c.label + "</div>";
        html += "<div class=\"cmd-text\" id=\"cmd_" + id + "\">" + formatCmd(c.cmd) + "</div>";
        html += "<button class=\"copy-btn\" id=\"cb_" + id + "\" data-cmd=\"" + id + "\">copy</button>";
        html += "</div>";
        window["_cmd_" + id] = c.cmd;
      });
    }
    html += "</div>";
  });
  document.getElementById("popover-body").innerHTML = html;
  var pop = document.getElementById("popover");
  pop.style.top = "50%"; pop.style.left = "50%"; pop.style.transform = "translate(-50%,-50%)";
  document.getElementById("backdrop").classList.add("open");
  pop.classList.add("open");
}

function closePopover() {
  document.getElementById("backdrop").classList.remove("open");
  document.getElementById("popover").classList.remove("open");
}

function formatCmd(cmd) {
  return cmd
    .replace(/--([\w]+)/g, "<span class=\"flag\">--$1</span>")
    .replace(/(env|csv|device_type|cfg|shell|gid)=/g, "<span class=\"param\">$1</span>=")
    .replace(/=([\w.\-\\]+)/g, "=<span class=\"value\">$1</span>");
}

function renderStatic() {
  document.getElementById("prog-fill").style.width = "0%";
  document.getElementById("prog-label").textContent = "";
  document.getElementById("complete-banner").classList.remove("visible");
  var html = "";
  html += "<div class=\"static-section\">";
  html += "<div class=\"static-title\">Set up sensor test jig</div>";
  html += "<div class=\"static-placeholder\"><div class=\"ph-icon\">&#x1F4F7;</div><div class=\"ph-text\">Sensor test set-up photo &mdash; coming soon</div></div>";
  html += "</div>";
  html += "<div class=\"static-section\">";
  html += "<div class=\"static-title\">Launch Radar Testing Script and enter PSC and MO#</div>";
  html += "<img class=\"static-img\" src=\"" + RADAR_IMG + "\" alt=\"Radar testing script output\">";
  html += "</div>";
  document.getElementById("steps").innerHTML = html;
}

function render() {
  var mode = MODES[currentMode];
  if (mode.static) { renderStatic(); return; }
  var checks = loadChecks(mode.key);
  var total = mode.steps.length;
  var done = mode.steps.filter(function(_, i) { return checks[i]; }).length;

  document.getElementById("prog-fill").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
  document.getElementById("prog-label").textContent = done + " / " + total;
  document.getElementById("complete-banner").classList.toggle("visible", done === total);

  var html = "";
  var lastSection = null;

  mode.steps.forEach(function(s, i) {
    if (s.section && s.section !== lastSection) {
      html += "<div class=\"section-label\">" + s.section + "</div>";
      lastSection = s.section;
    }
    var isDone = !!checks[i];
    var hasAA = !!s.aaNote;

    html += "<div class=\"step" + (isDone ? " done" : "") + (hasAA ? " has-note" : "") + "\" data-idx=\"" + i + "\" data-aa=\"" + (s.aaNote || "") + "\">";
    html += "<div class=\"step-num\">" + (i + 1).toString().padStart(2, "0") + "</div>";
    html += "<div class=\"check-box\" data-check=\"" + i + "\"><svg class=\"check-icon\" viewBox=\"0 0 12 12\"><polyline points=\"1.5 6 4.5 9 10.5 3\"/></svg></div>";
    html += "<div class=\"step-body\">";
    html += "<div class=\"step-text\">" + s.text + "</div>";
    if (s.note) html += "<div class=\"step-note-short\">" + s.note + "</div>";
    var hasBadges = s.badges && s.badges.length;
    if (hasBadges || hasAA) {
      html += "<div class=\"badges\">";
      if (hasBadges) {
        s.badges.forEach(function(b) {
          if (b === "warn")   html += "<span class=\"badge badge-warn\">&#9888; &lt; v2.6.2 only</span>";
          if (b === "info")   html += "<span class=\"badge badge-info\">dual radar only</span>";
          if (b === "sensor") html += "<span class=\"badge badge-sensor\">&#9888; flow &middot; radar &middot; pressure</span>";
        });
      }
      if (hasAA) {
        var lbl = s.aaNote === "modbus" ? "&#x1F4CA; Modbus testing sample" : "&#x1F4CB; view AA notes";
        html += "<span class=\"note-trigger\" data-note=\"" + s.aaNote + "\">" + lbl + "</span>";
      }
      html += "</div>";
    }
    html += "</div></div>";
  });

  document.getElementById("steps").innerHTML = html;
}

// ── Event delegation (no inline onclick) ──────────────────────────────
document.getElementById("open-btn").addEventListener("click", loadOrCreateOrder);
document.getElementById("order-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") loadOrCreateOrder();
});
document.getElementById("reset-btn").addEventListener("click", function() {
  if (!currentOrder) return;
  if (!confirm("Reset all steps for this mode?")) return;
  saveChecks(MODES[currentMode].key, {});
  render();
});
document.getElementById("pri-green").addEventListener("click", function() { setPriority("green"); });
document.getElementById("pri-amber").addEventListener("click", function() { setPriority("amber"); });
document.getElementById("pri-red").addEventListener("click",   function() { setPriority("red"); });
document.getElementById("order-note-textarea").addEventListener("input", saveNote);
document.getElementById("backdrop").addEventListener("click", closePopover);
document.getElementById("popover-close").addEventListener("click", closePopover);

document.getElementById("tabs").addEventListener("click", function(e) {
  var tab = e.target.closest(".tab");
  if (tab) switchMode(parseInt(tab.getAttribute("data-mode")));
});

document.getElementById("order-pills-wrap").addEventListener("click", function(e) {
  var del = e.target.closest("[data-del]");
  if (del) { e.stopPropagation(); deletePill(del.getAttribute("data-del")); return; }
  var pill = e.target.closest(".order-pill");
  if (pill) switchOrder(pill.getAttribute("data-order"));
});

document.getElementById("steps").addEventListener("click", function(e) {
  var noteBtn = e.target.closest("[data-note]");
  if (noteBtn) { e.stopPropagation(); openNote(noteBtn.getAttribute("data-note")); return; }
  var checkBox = e.target.closest("[data-check]");
  if (checkBox) { e.stopPropagation(); toggleStep(parseInt(checkBox.getAttribute("data-check"))); return; }
  var step = e.target.closest(".step[data-aa]");
  if (step) {
    var aa = step.getAttribute("data-aa");
    if (aa) { openNote(aa); return; }
    var idx = step.getAttribute("data-idx");
    if (idx !== null) toggleStep(parseInt(idx));
  }
});

document.getElementById("popover-body").addEventListener("click", function(e) {
  var btn = e.target.closest("[data-cmd]");
  if (!btn) return;
  var id = btn.getAttribute("data-cmd");
  var cmd = window["_cmd_" + id];
  if (!cmd) return;
  navigator.clipboard.writeText(cmd).then(function() {
    btn.textContent = "copied!";
    btn.classList.add("copied");
    setTimeout(function() { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1500);
  });
});

document.addEventListener("keydown", function(e) { if (e.key === "Escape") closePopover(); });

// ── Init ──────────────────────────────────────────────────────────────
try {
  var last = localStorage.getItem("last_order");
  if (last && getOrders().indexOf(last) !== -1) {
    currentOrder = last;
    var sm = parseInt(localStorage.getItem("o:" + last + ":mode") || "0");
    currentMode = (sm >= 0 && sm < MODES.length) ? sm : 0;
  }
} catch(e) {}

window.addEventListener("beforeunload", function() {
  try { if (currentOrder) localStorage.setItem("last_order", currentOrder); } catch(e) {}
});

updateOrderUI();
if (currentOrder) render();

})();
