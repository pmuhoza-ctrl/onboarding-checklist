<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilote's notes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2335;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #7a8099;
    --dim: #4a5068;
    --accent: #4f8ef7;
    --accent-bg: rgba(79,142,247,0.12);
    --accent-border: rgba(79,142,247,0.3);
    --green: #3ecf8e;
    --green-bg: rgba(62,207,142,0.1);
    --green-border: rgba(62,207,142,0.25);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,0.1);
    --amber-border: rgba(245,158,11,0.3);
    --radius: 10px;
    --radius-sm: 6px;
    --font: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
    line-height: 1.6;
  }

  .container { max-width: 720px; margin: 0 auto; }

  header { margin-bottom: 2rem; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: .5rem;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -.02em;
    margin-bottom: .25rem;
  }

  .subtitle { font-size: 13px; color: var(--muted); }

  .tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; }

  .tab {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
  }
  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }

  .progress-track { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .35s cubic-bezier(.4,0,.2,1); }

  .progress-label { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 44px; text-align: right; }

  .reset-btn {
    font-family: var(--font);
    font-size: 12px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all .15s;
  }
  .reset-btn:hover { color: var(--muted); border-color: var(--border2); }

  .steps { display: flex; flex-direction: column; gap: 4px; }

  .step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background .12s, border-color .12s;
    position: relative;
  }
  .step:hover { background: var(--surface2); border-color: var(--border); }
  .step.done { background: var(--green-bg); border-color: var(--green-border); }

  /* Steps with notes — clicking the row opens the popover, not checks */
  .step.has-note { cursor: default; }
  .step.has-note:hover { background: var(--surface2); border-color: var(--border); }

  .step-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    min-width: 20px;
    padding-top: 2px;
    flex-shrink: 0;
  }
  .step.done .step-num { color: var(--green); }

  .check-box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1.5px solid var(--dim);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    margin-top: 1px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .step.done .check-box { background: var(--green); border-color: var(--green); }

  .check-icon {
    display: none;
    width: 11px; height: 11px;
    stroke: #fff; stroke-width: 2.5;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .step.done .check-icon { display: block; }

  .step-body { flex: 1; min-width: 0; }

  .step-text { font-size: 14px; font-weight: 500; color: var(--text); transition: color .12s; }
  .step.done .step-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--green); }

  .step-note-short { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .step.done .step-note-short { color: var(--dim); }

  /* AA note indicator */
  .note-trigger {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 6px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .note-trigger:hover { background: rgba(79,142,247,0.22); }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .badge-warn { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .badge-info { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--dim);
    text-transform: uppercase;
    padding: 1rem 0 .4rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: .5rem;
    margin-top: .5rem;
  }

  .complete-banner {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 1rem;
    font-size: 14px;
    font-weight: 500;
    color: var(--green);
  }
  .complete-banner.visible { display: flex; }

  /* ── Popover ── */
  .popover-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
  }
  .popover-backdrop.open { display: block; }

  .popover {
    display: none;
    position: fixed;
    z-index: 101;
    width: min(520px, calc(100vw - 2rem));
    background: #1a1f30;
    border: 1px solid var(--border2);
    border-radius: 14px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .popover.open { display: block; }

  .popover-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .popover-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .popover-close {
    width: 24px; height: 24px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background .12s, color .12s;
    line-height: 1;
  }
  .popover-close:hover { background: var(--surface2); color: var(--text); }

  .popover-body { padding: 16px; overflow-y: auto; max-height: 60vh; }

  /* Note sections inside popover */
  .note-section { margin-bottom: 20px; }
  .note-section:last-child { margin-bottom: 0; }

  .note-section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .note-description {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
    line-height: 1.6;
  }

  /* Command blocks */
  .cmd-block {
    background: #0c0f1a;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 8px;
    position: relative;
  }

  .cmd-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: .04em;
  }

  .cmd-text {
    font-family: var(--mono);
    font-size: 11.5px;
    color: #c9d1e8;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.7;
  }

  /* Syntax highlighting within commands */
  .cmd-text .flag { color: var(--amber); }
  .cmd-text .value { color: var(--green); }
  .cmd-text .param { color: #a78bfa; }

  .copy-btn {
    position: absolute;
    top: 8px; right: 8px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all .12s;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--border2); }
  .copy-btn.copied { color: var(--green); border-color: var(--green-border); }

  /* Device type table */
  .device-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .device-table th {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--dim);
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
  }
  .device-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .device-table tr:last-child td { border-bottom: none; }
  .device-table .mono { font-family: var(--mono); color: var(--accent); font-size: 11px; }
  .device-table .model { color: var(--muted); }

  @media (max-width: 480px) {
    h1 { font-size: 1.3rem; }
    .step { padding: 10px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="eyebrow">Pilote's notes · Onboarding</div>
    <h1>Commissioning checklist</h1>
    <p class="subtitle">Click a step to open notes · Click the checkbox to mark complete</p>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" onclick="switchMode(0)">KK only</button>
    <button class="tab" onclick="switchMode(1)">Cumulosity only</button>
    <button class="tab" onclick="switchMode(2)">Dual endpoint</button>
  </div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="progress-label" id="prog-label">0 / 0</span>
    <button class="reset-btn" onclick="resetCurrent()">Reset</button>
  </div>

  <div class="complete-banner" id="complete-banner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    All steps complete — device commissioned.
  </div>

  <div class="steps" id="steps"></div>
</div>

<!-- Popover -->
<div class="popover-backdrop" id="backdrop" onclick="closePopover()"></div>
<div class="popover" id="popover">
  <div class="popover-header">
    <span class="popover-title" id="popover-title">AA Notes</span>
    <button class="popover-close" onclick="closePopover()">✕</button>
  </div>
  <div class="popover-body" id="popover-body"></div>
</div>

<script>
// ── AA Note definitions ────────────────────────────────────────────────
const AA_NOTES = {
  register: {
    title: 'Register device — AA notes',
    sections: [
      {
        label: 'Device types reference',
        description: 'Set device_type to match the hardware you are onboarding:',
        table: [
          { type: 'captis_pulse',   model: 'Captis Pulse Lite EA' },
          { type: 'captis_pulse_2', model: 'Captis Pulse 1.2' },
          { type: 'captis_multi_2', model: 'Captis Multi 1.2 or Captis Recharge' },
          { type: 'CaptisS2',       model: 'Captis S2' },
        ]
      },
      {
        label: 'Step 1 — Delete existing registration (if re-onboarding)',
        description: 'Clears any stale registration before starting fresh.',
        commands: [
          { label: 'delete_reg', cmd: 'captis-cli.exe onboard env=ManagementTenant.txt csv=Devices.txt device_type=captis_pulse --delete_reg' }
        ]
      },
      {
        label: 'Step 2 — Pre-register the device',
        description: 'Creates a pending registration entry on the management tenant.',
        commands: [
          { label: 'pre_reg', cmd: 'captis-cli.exe onboard env=ManagementTenant.txt csv=Devices.txt device_type=captis_pulse --pre_reg' }
        ]
      },
      {
        label: 'Step 3 — Onboard as skeleton device',
        description: 'Registers, pre-accepts, and onboards the device to Cumulocity. Confirm device_type matches your hardware (see table above).',
        commands: [
          { label: 'onboard (Pulse 1.2 example)', cmd: 'captis-cli.exe onboard env=ManagementTenant.txt csv=Devices.txt device_type=captis_pulse_2 --onboard' },
          { label: 'onboard (Multi 1.2 with config + shell)', cmd: 'captis-cli.exe onboard env=DevTenant.txt csv=Devices.txt device_type=captis_multi_2 cfg=config_wipe_servers_add_apj_bootstrap.json shell=shell_bootstrap_only.txt --queue' }
        ]
      },
      {
        label: 'Diagnosis — check group',
        description: 'Use to verify group membership after onboarding. Replace the gid with your actual group ID.',
        commands: [
          { label: 'diagnosis', cmd: 'captis-cli.exe diagnosis env=ManagementTenant.txt gid=52216342884 -e' }
        ]
      },
      {
        label: 'Queue a shell command',
        description: 'Useful for queuing a sleep/wake command after registration.',
        commands: [
          { label: 'queue shell', cmd: 'captis-cli.exe onboard env=ManagementTenant.txt csv=Devices.txt device_type=captis_pulse_2 shell=shell_sleep.txt --queue' }
        ]
      }
    ]
  },

  deviceconfig: {
    title: 'Queue device config — AA notes',
    sections: [
      {
        label: 'Change configuration on Cumulocity',
        description: 'Queue a config file to apply to CaptisS2 devices. Replace the cfg filename with the config you need.',
        commands: [
          { label: 'queue config', cmd: 'captis-cli.exe onboard env=ManagementTenant.txt csv=Devices.txt device_type=CaptisS2 cfg=S2FlowKit4_20mAConfiguration.json --queue' }
        ]
      },
      {
        label: 'Disable Bluetooth (Cumulosity only)',
        description: 'Use this config when disabling BLE on Cumulosity-only devices.',
        commands: [
          { label: 'disable BLE', cmd: 'captis-cli.exe onboard env=ManagementTenant.txt csv=Devices.txt device_type=CaptisS2 cfg=S2_DissableBLE.txt --queue' }
        ]
      },
      {
        label: 'Switch to Spark + OneNZ (NZ devices)',
        description: 'Apply this config to NZ devices to switch network provider.',
        commands: [
          { label: 'NZ network config', cmd: 'captis-cli.exe onboard env=ManagementTenant.txt csv=Devices.txt device_type=CaptisS2 cfg=S2_NetworkOneNZ_Spark.txt --queue' }
        ]
      },
      {
        label: 'Last config + dormant mode (NZ Cumulosity)',
        description: 'Sends the SIM switch and dormant mode together as the final step for NZ Cumulosity devices.',
        commands: [
          { label: 'last config NZ', cmd: 'captis-cli.exe onboard env=ManagementTenant.txt csv=Devices.txt device_type=CaptisS2 cfg=LastConfigOneNZ.txt shell=shell_s2sleep.txt --queue' }
        ]
      }
    ]
  }
};

// ── Step definitions ───────────────────────────────────────────────────
const MODES = [
  {
    key: 'kk',
    steps: [
      { text: 'FOTA' },
      { text: 'Roll BLUE key', note: 'Firmware < v2.6.2 only', badges: ['warn'] },
      { text: 'Move to account' },
      { text: 'Wake until moved' },
      { text: 'Configure for ticket', note: 'NZ, AU, INT, NB-IoT, CATM1, etc.' },
      { text: 'Last config', note: 'Switch SIM & dormant mode — do together' },
    ]
  },
  {
    key: 'cumu',
    steps: [
      { text: 'FOTA' },
      { text: 'Roll BLUE key', note: 'Disable after use', badges: ['warn'] },
      { text: 'Queue server', note: 'KK script: S2ConfigurationWithC8YServerOnly — gives Cumulosity server on management tenant (watercare or other tenant are different)' },
      { text: 'Register device', note: 'Onboard — see AA notes', aaNote: 'register', section: 'Cumulosity scripts' },
      { text: 'Bootstrap', note: 'Shell command — choose Cumulosity › fresh_conn' },
      { text: 'Queue device config', note: 'See AA notes', aaNote: 'deviceconfig' },
      { text: 'Test sensors', note: 'Flow and radar' },
      { text: 'Disable Bluetooth' },
      { text: 'Introduce networks', note: 'See AA notes', section: 'Network' },
      { text: 'Switch network then dormant mode', note: 'Do together' },
    ]
  },
  {
    key: 'dual',
    steps: [
      { text: 'FOTA' },
      { text: 'Roll BLUE key', note: 'Firmware < v2.6.2 only', badges: ['warn'] },
      { text: 'Queue server', note: 'Using KK script' },
      { text: 'Register device', note: 'Using Cumu script — see AA notes', aaNote: 'register', section: 'Cumulosity scripts' },
      { text: 'Bootstrap', note: 'Shell command — choose Cumulosity › greedy' },
      { text: 'Queue device config', note: 'Search in KK scripts — see AA notes', aaNote: 'deviceconfig' },
      { text: 'Test sensors and dual endpoints' },
      { text: 'Check SLAVE ID', note: 'Dual radar devices only', badges: ['info'] },
      { text: 'Check networks', section: 'Network' },
      { text: 'Last config & dormant mode' },
    ]
  }
];

// ── State ──────────────────────────────────────────────────────────────
let currentMode = 0;

function loadChecks(key) {
  try { return JSON.parse(localStorage.getItem('checks_' + key) || '{}'); } catch { return {}; }
}
function saveChecks(key, checks) {
  try { localStorage.setItem('checks_' + key, JSON.stringify(checks)); } catch {}
}

function toggleStep(idx, e) {
  e.stopPropagation();
  const mode = MODES[currentMode];
  const checks = loadChecks(mode.key);
  checks[idx] = !checks[idx];
  saveChecks(mode.key, checks);
  render();
}

function switchMode(idx) {
  currentMode = idx;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  render();
}

function resetCurrent() {
  saveChecks(MODES[currentMode].key, {});
  render();
}

// ── Popover ────────────────────────────────────────────────────────────
function openNote(noteKey, e) {
  e && e.stopPropagation();
  const note = AA_NOTES[noteKey];
  if (!note) return;

  document.getElementById('popover-title').textContent = note.title;

  let html = '';
  note.sections.forEach(sec => {
    html += '<div class="note-section">';
    html += '<div class="note-section-label">' + sec.label + '</div>';
    if (sec.description) html += '<div class="note-description">' + sec.description + '</div>';

    if (sec.table) {
      html += '<table class="device-table"><thead><tr><th>device_type</th><th>Hardware model</th></tr></thead><tbody>';
      sec.table.forEach(row => {
        html += '<tr><td class="mono">' + row.type + '</td><td class="model">' + row.model + '</td></tr>';
      });
      html += '</tbody></table>';
    }

    if (sec.commands) {
      sec.commands.forEach((c, ci) => {
        const id = noteKey + '_' + ci;
        html += '<div class="cmd-block">';
        html += '<div class="cmd-label">' + c.label + '</div>';
        html += '<div class="cmd-text" id="cmd_' + id + '">' + formatCmd(c.cmd) + '</div>';
        html += '<button class="copy-btn" id="copybtn_' + id + '" onclick="copyCmd(\'' + id + '\', \'' + escapeJs(c.cmd) + '\')">copy</button>';
        html += '</div>';
      });
    }
    html += '</div>';
  });

  document.getElementById('popover-body').innerHTML = html;

  // Position the popover centred in viewport
  const pop = document.getElementById('popover');
  pop.style.top = '50%';
  pop.style.left = '50%';
  pop.style.transform = 'translate(-50%, -50%)';

  document.getElementById('backdrop').classList.add('open');
  pop.classList.add('open');
}

function closePopover() {
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('popover').classList.remove('open');
}

function formatCmd(cmd) {
  // Colour flags and values for readability
  return cmd
    .replace(/(--[\w]+)/g, '<span class="flag">$1</span>')
    .replace(/(env|csv|device_type|cfg|shell|gid)=/g, '<span class="param">$1</span>=')
    .replace(/=([\w.\-\\]+)/g, '=<span class="value">$1</span>');
}

function escapeJs(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function copyCmd(id, cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    const btn = document.getElementById('copybtn_' + id);
    if (!btn) return;
    btn.textContent = 'copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
  });
}

// ── Render ─────────────────────────────────────────────────────────────
function render() {
  const mode = MODES[currentMode];
  const checks = loadChecks(mode.key);
  const total = mode.steps.length;
  const done = mode.steps.filter((_, i) => checks[i]).length;

  document.getElementById('prog-fill').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  document.getElementById('prog-label').textContent = done + ' / ' + total;
  document.getElementById('complete-banner').classList.toggle('visible', done === total);

  let html = '';
  let lastSection = null;

  mode.steps.forEach((s, i) => {
    if (s.section && s.section !== lastSection) {
      html += '<div class="section-label">' + s.section + '</div>';
      lastSection = s.section;
    }

    const isDone = !!checks[i];
    const hasAA = !!s.aaNote;

    // Row click: open note if has one, otherwise toggle
    const rowClick = hasAA ? 'openNote(\'' + s.aaNote + '\', event)' : 'toggleStep(' + i + ', event)';

    html += '<div class="step' + (isDone ? ' done' : '') + (hasAA ? ' has-note' : '') + '" onclick="' + rowClick + '">';
    html += '<div class="step-num">' + (i + 1).toString().padStart(2, '0') + '</div>';

    // Checkbox always toggles
    html += '<div class="check-box" onclick="toggleStep(' + i + ', event)">';
    html += '<svg class="check-icon" viewBox="0 0 12 12"><polyline points="1.5 6 4.5 9 10.5 3"/></svg>';
    html += '</div>';

    html += '<div class="step-body">';
    html += '<div class="step-text">' + s.text + '</div>';
    if (s.note) html += '<div class="step-note-short">' + s.note + '</div>';

    const hasBadges = s.badges && s.badges.length;
    if (hasBadges || hasAA) {
      html += '<div class="badges">';
      if (hasBadges) {
        s.badges.forEach(b => {
          if (b === 'warn') html += '<span class="badge badge-warn">⚠ &lt; v2.6.2 only</span>';
          if (b === 'info') html += '<span class="badge badge-info">dual radar only</span>';
        });
      }
      if (hasAA) {
        html += '<span class="note-trigger" onclick="openNote(\'' + s.aaNote + '\', event)">📋 view AA notes</span>';
      }
      html += '</div>';
    }

    html += '</div></div>';
  });

  document.getElementById('steps').innerHTML = html;
}

// Restore last mode
try {
  const saved = parseInt(localStorage.getItem('last_mode') || '0');
  if (saved >= 0 && saved < MODES.length) {
    currentMode = saved;
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === currentMode));
  }
} catch {}

window.addEventListener('beforeunload', () => {
  try { localStorage.setItem('last_mode', currentMode); } catch {}
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopover(); });

render();
</script>
</body>
</html>
